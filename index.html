<!-- HTML template for the frontend react app: https://developer.mozilla.org/en-US/docs/Web/HTML --><!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-oficial.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E3A5F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gestão Eclesiástica" />
    <title>Gestão Eclesiástica — Versão Local Desktop</title>
    <meta
      name="description"
      content="Sistema integrado de gestão eclesiástica: membros, congregados, obreiros, dízimos, escalas e congregações."
    />
    <script>
      // Flag global para execução 100% offline (tanto em file:// quanto em Electron)
      if (window.location.protocol === 'file:' || (typeof navigator !== 'undefined' && navigator.userAgent && navigator.userAgent.includes('Electron'))) {
        window.__ADTC_OFFLINE_ONLY__ = true;
      }
      // Fontes locais de sistema como padrão offline; Google Fonts opcional quando online via HTTP
      if (window.location.protocol.startsWith('http')) {
        var l1 = document.createElement('link');
        l1.rel = 'preconnect';
        l1.href = 'https://fonts.googleapis.com';
        document.head.appendChild(l1);
        var l2 = document.createElement('link');
        l2.rel = 'preconnect';
        l2.href = 'https://fonts.gstatic.com';
        l2.crossOrigin = '';
        document.head.appendChild(l2);
        var l3 = document.createElement('link');
        l3.rel = 'stylesheet';
        l3.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap';
        document.head.appendChild(l3);
      }
    </script>
    <meta name="author" content="Skip (https://goskip.dev)" />
    <meta property="og:image" content="/og-image.jpeg" />
    <meta property="og:title" content="Gestão Eclesiástica" />
    <meta
      property="og:description"
      content="Até que ele venha..
Nossa Missão é pregar..
Até que ele venha..."
    />
  </head>

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script>
      // No modo file:// ou sem internet, evita travar se o skip.js externo não carregar
      if (window.location.protocol.startsWith('http')) {
        var s = document.createElement('script');
        s.src = 'https://goskip.dev/skip.js';
        s.async = true;
        document.body.appendChild(s);
      }
    </script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
